[project]
name = "mdit"
version = "0.1.0"
description = "Convert macOS clipboard content and files to Markdown with MarkItDown."
requires-python = ">=3.11"
dependencies = [
    "markitdown[all]>=0.1.0",
    "openai>=1.0.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mdit = "mdit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
